# AdditionalDisplay: each RDP client gets its own output, sized to its window. RemoteAccess would
# also switch the HDMI seat to the login screen, taking it away from the astronaut desktop.
# Linked as app-org.kde.krdpserver.service.d/kiosk.conf in the kiosk home only
[Service]
ExecStart=
ExecStart=/usr/bin/krdpserver --mode AdditionalDisplay

# Shared data folder for astronaut and astronaut-kiosk, copied to /etc/tmpfiles.d.
# The default ACL makes what either user creates inside group writable, whatever
# the umask of the app. Applied at boot since the Docker build has no ACL support
d  /srv/astro-data  2775  root  astro  -
A+ /srv/astro-data  -     -     -      -  default:user::rwx,default:group::rwx,default:mask::rwx,default:other::r-x

[global]
   workgroup = WORKGROUP
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   # The Samba password is separate from the login password: each user changes it
   # with smbpasswd, no root needed (with sync on, the change is refused by PAM)
   unix password sync = no
   map to guest = bad user
   usershare allow guests = yes

[homes]
   comment = Home Directories
   browseable = no
   read only = yes
   create mask = 0700
   directory mask = 0700
   valid users = %S

[astroarch]
   comment = AstroArch
   path = /home/astronaut
   browseable = yes
   writeable = yes
   read only = no
   create mask = 0644
   directory mask = 0755
   valid users = astronaut

[astro-data]
   comment = AstroArch shared data
   path = /srv/astro-data
   browseable = yes
   writeable = yes
   read only = no
   force group = astro
   create mask = 0664
   directory mask = 2775
   valid users = astronaut astronaut-kiosk

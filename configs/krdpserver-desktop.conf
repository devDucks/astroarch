# RemoteAccess: the RDP client gets a virtual screen sized to its window, which follows resizes,
# while the HDMI output shows the login screen. On disconnect astroarch-rdp-return.service gives
# the HDMI seat back to this session.
# Linked as app-org.kde.krdpserver.service.d/desktop.conf in the astronaut home only
[Service]
ExecStart=
ExecStart=/usr/bin/krdpserver --mode RemoteAccess
